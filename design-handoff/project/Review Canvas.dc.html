<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>html,body{margin:0;background:#E7E9EC;}*,*::before,*::after{box-sizing:border-box;}a{color:#0B6A73;}a:hover{color:#0E7C86;}</style>
</helmet>
<sc-for list="{{ variants }}" as="v" hint-placeholder-count="2">
  <section id="{{ v.id }}" style="padding:80px;display:flex;flex-direction:column;gap:40px;font-family:Inter,system-ui,sans-serif;color:#1E293B;">
    <div style="display:flex;align-items:center;gap:16px;">
      <span style="padding:6px 12px;border-radius:6px;background:#1E293B;color:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:18px;">{{ v.id }}</span>
      <h1 style="margin:0;font-size:40px;font-weight:700;">{{ v.name }}</h1>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;">
      <sc-for list="{{ v.frames }}" as="f" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <span style="font-family:'JetBrains Mono',monospace;font-size:16px;color:#475569;">{{ f.label }}</span>
          <div style="width:{{ f.w }};height:{{ f.h }};overflow:hidden;border-radius:12px;background:#FFFFFF;box-shadow:0 30px 60px -30px rgba(0,0,0,.35);">
            <sc-if value="{{ f.isHome }}" hint-placeholder-val="{{ false }}"><dc-import name="Home" variant="{{ v.key }}" device="{{ f.device }}" frame-height="{{ f.fh }}" hint-size="100%,100%"></dc-import></sc-if>
            <sc-if value="{{ f.isPackages }}" hint-placeholder-val="{{ false }}"><dc-import name="Packages" variant="{{ v.key }}" device="{{ f.device }}" frame-height="{{ f.fh }}" hint-size="100%,100%"></dc-import></sc-if>
            <sc-if value="{{ f.isDetail }}" hint-placeholder-val="{{ false }}"><dc-import name="Package Detail" variant="{{ v.key }}" device="{{ f.device }}" frame-height="{{ f.fh }}" hint-size="100%,100%"></dc-import></sc-if>
          </div>
        </div>
      </sc-for>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:16px;color:#475569;">Tokens and components</span>
        <div style="width:1440px;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.35);">
          <dc-import name="Component Sheet" variant="{{ v.key }}" hint-size="1440px,3600px"></dc-import>
        </div>
      </div>
    </div>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const frames = [];
    ['Home', 'Packages', 'Package Detail'].forEach(name => {
      const flags = { isHome: name === 'Home', isPackages: name === 'Packages', isDetail: name === 'Package Detail' };
      frames.push({ ...flags, device: 'desktop', label: name + ' · Desktop 1440', w: '1440px', h: '900px', fh: 900 });
      frames.push({ ...flags, device: 'mobile', label: name + ' · Mobile 390', w: '390px', h: '844px', fh: 844 });
    });
    return {
      variants: [
        { id: '1a', key: 'A', name: 'Variant A · Bright and adventurous', frames },
        { id: '1b', key: 'B', name: 'Variant B · Warm and local', frames }
      ]
    };
  }
}
</script>
</body>
</html>
