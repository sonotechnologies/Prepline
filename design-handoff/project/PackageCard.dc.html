<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:var(--tr);font-family:var(--fb);color:var(--text);" style-hover="transform:var(--lift);box-shadow:var(--shadowHover);">
  <div style="position:relative;margin:var(--inset) var(--inset) 0;border-radius:var(--arch);overflow:hidden;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--ph1) 0 12px,var(--ph2) 12px 24px);display:flex;align-items:flex-end;">
    <span style="margin:12px;padding:4px 8px;border-radius:4px;background:rgba(255,255,255,.85);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--phText);">{{ pkg.photo }}</span>
    <sc-if value="{{ pkg.featured }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;right:12px;bottom:12px;padding:6px 12px;border-radius:var(--br);background:var(--badgeBg);color:var(--badgeText);font-size:14px;font-weight:700;">Featured</span>
    </sc-if>
  </div>
  <div style="padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px;flex:1;">
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);">
      <span aria-label="Flag" style="display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:20px;padding:0 5px;border-radius:3px;background:var(--dark);color:var(--onDark);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:600;">{{ pkg.code }}</span>{{ pkg.country }}
    </div>
    <a href="#" style="text-decoration:none;color:var(--text);"><h3 style="margin:0;font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--ht);font-size:var(--h3);line-height:1.2;text-wrap:balance;">{{ pkg.title }}</h3></a>
    <span style="font-size:14px;color:var(--muted);">{{ pkg.durText }}</span>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <sc-for list="{{ pkg.tags }}" as="t" hint-placeholder-count="3">
        <span style="padding:4px 10px;border-radius:var(--br);background:var(--tint);color:var(--tagText);font-size:14px;font-weight:500;">{{ t }}</span>
      </sc-for>
    </div>
    <div style="margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;">
      <span style="font-size:16px;color:var(--text);">From <strong style="font-family:var(--fh);font-weight:var(--hw);font-size:22px;letter-spacing:var(--ht);">{{ pkg.priceText }}</strong> per person</span>
      <span style="font-size:14px;color:var(--muted);">Final quote on WhatsApp</span>
    </div>
    <a href="{{ pkg.wa }}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:var(--br);background:transparent;color:var(--sec);border:1.5px solid var(--sec);font-weight:600;font-size:16px;text-decoration:none;transition:background .2s ease;" style-hover="background:var(--secHoverBg);color:var(--sec);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.4A8.5 8.5 0 1 1 20.5 11.5z"></path></svg>
      Enquire on WhatsApp
    </a>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;pkg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
